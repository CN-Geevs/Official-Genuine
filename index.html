<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Geevs® 官方正品验证</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --brand: #0f172a;
    --gold: #c9a227;
    --success: #16a34a;
    --muted: #6b7280;
    --line: #e5e7eb;
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #e9eaee;
    color: #111827;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(0, 0, 0, .08);
  }

  /* 顶部品牌 */
  .topbar {
    background: var(--brand);
    color: #fff;
    padding: 26px 20px 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .topbar::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .brand {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 4px;
    line-height: 1;
  }
  .brand .reg {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0;
    vertical-align: super;
    margin-left: 2px;
    opacity: .9;
  }
  .brand-sub {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 6px;
    opacity: .55;
  }

  main {
    flex: 1;
    padding: 22px 18px 28px;
  }

  /* 加载中 */
  .loading-card {
    text-align: center;
    padding: 52px 20px;
  }
  .spinner {
    width: 38px;
    height: 38px;
    border: 3px solid var(--line);
    border-top-color: var(--brand);
    border-radius: 50%;
    margin: 0 auto 18px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    margin: 0;
    color: #6b7280;
    font-size: 13.5px;
  }
  .loading-sub {
    margin: 8px 0 0;
    color: #9ca3af;
    font-size: 11.5px;
  }

  /* 正品结果 */
  .result-icon {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
    background: var(--success);
    box-shadow: 0 6px 20px rgba(22, 163, 74, .28);
    animation: pop .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes pop {
    from { transform: scale(.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .result-title {
    text-align: center;
    font-size: 21px;
    font-weight: 700;
    margin: 18px 0 8px;
    letter-spacing: .3px;
  }
  .result-sub {
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    margin: 0 0 22px;
  }

  /* 信息卡片 */
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: #111827;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-title::before {
    content: "";
    width: 3px;
    height: 12px;
    background: var(--gold);
    border-radius: 2px;
  }
  .info-list { margin: 0; }
  .info-list > div {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13.5px;
  }
  .info-list > div:first-child { padding-top: 0; }
  .info-list > div:last-child { border-bottom: 0; padding-bottom: 0; }
  .info-list dt { color: var(--muted); flex-shrink: 0; }
  .info-list dd {
    margin: 0;
    font-weight: 600;
    text-align: right;
    word-break: break-all;
  }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .5px;
  }

  /* 温馨提示 */
  .notice {
    background: #f9fafb;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 12px;
    line-height: 1.8;
    color: #4b5563;
  }
  .notice strong {
    display: block;
    color: #111827;
    font-size: 13px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="phone">
  <header class="topbar">
    <div class="brand">Geevs<span class="reg">®</span></div>
    <div class="brand-sub">官方正品验证</div>
  </header>

  <main id="app"></main>
</div>

<script>
  /* ---------------- 模拟数据 ---------------- */
  const DATA = {
    masked: 'GEEVS-8F2C-••••-X9WE',
    product: {
      name: 'Geevs® 经典纯棉短袖T(夏)',
      sku: 'HV-2026-T1-999',
      color: '曜石黑',
      batch: 'AH626 0915 ONE-1',
      mfg: '2026-12'
    }
  };

  const pad = n => String(n).padStart(2, '0');
  const fmt = d =>
    `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

  /* ---------------- 卡片片段 ---------------- */
  function productCard() {
    const p = DATA.product;
    return `
      <div class="card">
        <div class="card-title">商品信息</div>
        <dl class="info-list">
          <div><dt>商品名称</dt><dd>${p.name}</dd></div>
          <div><dt>款号</dt><dd>${p.sku}</dd></div>
          <div><dt>颜色</dt><dd>${p.color}</dd></div>
          <div><dt>生产批次</dt><dd>${p.batch}</dd></div>
          <div><dt>生产日期</dt><dd>${p.mfg}</dd></div>
        </dl>
      </div>`;
  }

  function recordCard() {
    return `
      <div class="card">
        <div class="card-title">验证记录</div>
        <dl class="info-list">
          <div><dt>防伪码</dt><dd class="mono">${DATA.masked}</dd></div>
          <div><dt>验证时间</dt><dd>${fmt(new Date())}</dd></div>
          <div><dt>验证结果</dt><dd>正品</dd></div>
        </dl>
      </div>`;
  }

  /* ---------------- 仅保留两个状态 ---------------- */
  const T = {
    loading: () => `
      <div class="card loading-card">
        <div class="spinner"></div>
        <p class="loading-text">正在验证防伪码…</p>
        <p class="loading-sub">请稍候，通常不超过 3 秒</p>
      </div>`,

    genuine: () => `
      <div class="result-icon success">✓</div>
      <h1 class="result-title">正品验证通过</h1>
      <p class="result-sub">该商品为 Geevs® 官方正品<br>感谢您选择 Geevs®</p>

      ${productCard()}
      ${recordCard()}

      <div class="notice">
        <strong>温馨提示</strong>
        该防伪码已验证为正品。请勿将防伪码拍照或分享给他人，以免被冒用。
      </div>`
  };

  /* ---------------- 渲染与自动跳转 ---------------- */
  const app = document.getElementById('app');

  function go(state) {
    app.innerHTML = T[state]();
  }

  // 启动先展示加载中，随后自动进入正品页面
  go('loading');
  setTimeout(() => go('genuine'), 1400);
</script>
</body>
</html>
